<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangGraph 智能文档问答 Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header { text-align: center; padding: 24px 0 8px; }
  header h1 { font-size: 24px; color: #1a1a2e; }
  header p { color: #888; margin-top: 6px; font-size: 14px; }
  .badge { display: inline-block; background: #eef2ff; color: #4f46e5; border-radius: 12px; padding: 2px 10px; font-size: 12px; margin-left: 8px; }
  .input-area { display: flex; gap: 10px; margin: 20px 0 12px; }
  #question { flex: 1; padding: 14px 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; }
  #question:focus { border-color: #4f46e5; }
  #askBtn { padding: 14px 26px; background: #4f46e5; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
  #askBtn:disabled { background: #a5a5c9; cursor: not-allowed; }
  .meta { font-size: 12px; color: #999; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h3 { font-size: 14px; color: #4f46e5; margin-bottom: 10px; }
  #answer { white-space: pre-wrap; line-height: 1.7; font-size: 15px; }
  #log { list-style: none; }
  #log li { padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 13px; color: #555; font-family: Consolas, monospace; }
  #reflection { white-space: pre-wrap; font-size: 13px; color: #555; font-family: Consolas, monospace; line-height: 1.6; }
  .loading { color: #4f46e5; font-size: 14px; }
  .error { color: #dc2626; }
  .hint { font-size: 12px; color: #bbb; text-align: center; margin-top: 20px; }
  .mode-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 14px 0 4px; font-size: 13px; color: #666; }
  .mode-btn { padding: 8px 18px; border: 2px solid #4f46e5; background: #fff; color: #4f46e5; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all .2s; }
  .mode-btn:hover { background: #eef2ff; }
  .mode-btn.active { background: #4f46e5; color: #fff; }
  .mode-status { font-size: 12px; color: #999; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>LangGraph 智能文档问答 Agent <span class="badge">ReAct + RAG</span></h1>
    <p>文档问答 · 实时天气 · 联网搜索 · 普通对话</p>
  </header>

  <div class="mode-bar">
    <span>运行模式：</span>
    <button class="mode-btn" data-mode="deepseek">DeepSeek</button>
    <button class="mode-btn" data-mode="openai">OpenAI</button>
    <button class="mode-btn" data-mode="qwen">通义</button>
    <button class="mode-btn" data-mode="zhipu">智谱</button>
    <button class="mode-btn" data-mode="moonshot">Kimi</button>
    <button class="mode-btn" data-mode="ollama">本地</button>
    <button class="mode-btn" data-mode="offline">纯检索</button>
    <button class="mode-btn" id="settingsBtn" style="border-color:#999;color:#666;">⚙ 换 Key</button>
    <span class="mode-status" id="modeStatus"></span>
  </div>

  <div class="input-area">
    <input id="question" placeholder="输入问题，例如：这个项目的核心架构是什么？" autocomplete="off">
    <button id="askBtn">提问</button>
  </div>
  <div class="meta">示例：项目的核心功能 / 用什么框架 / 如何部署 / 今天天气 / 最近AI新闻</div>

  <div id="result">
    <div class="card"><h3>回答</h3><div id="answer" class="loading">等待提问…</div></div>
    <div class="card"><h3>推理过程（Agent 执行日志）</h3><ul id="log"></ul></div>
    <div class="card"><h3>反思记录</h3><div id="reflection">—</div></div>
  </div>
  <div class="hint">Powered by LangGraph · 双引擎搜索（博查 + DuckDuckGo）· 点击上方按钮切换模式或更换 API Key</div>
</div>

<!-- 更换 API Key 弹窗 -->
<div id="settingsModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:12px; padding:24px; width:420px; max-width:90%; box-shadow:0 4px 20px rgba(0,0,0,.2);">
    <h3 style="margin-bottom:16px; color:#1a1a2e;">更换 API Key</h3>
    <div style="margin-bottom:12px;">
      <label style="font-size:13px; color:#666;">服务商</label>
      <select id="cfgProvider" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; margin-top:4px;">
        <option value="deepseek">DeepSeek（deepseek-chat）</option>
        <option value="openai">OpenAI（gpt-4o-mini）</option>
        <option value="qwen">通义千问（qwen-plus）</option>
        <option value="zhipu">智谱 GLM（glm-4-flash）</option>
        <option value="moonshot">Kimi（moonshot-v1-8k）</option>
      </select>
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:13px; color:#666;">API Key</label>
      <input id="cfgApiKey" type="password" placeholder="sk-..." style="width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; margin-top:4px;">
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:13px; color:#666;">Base URL（可选，默认用官方地址）</label>
      <input id="cfgBaseUrl" placeholder="https://api.deepseek.com/v1" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; margin-top:4px;">
    </div>
    <div style="margin-bottom:16px;">
      <label style="font-size:13px; color:#666;">模型名（可选）</label>
      <input id="cfgModel" placeholder="deepseek-chat" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; margin-top:4px;">
    </div>
    <div style="text-align:right;">
      <button id="cfgCancel" style="padding:8px 16px; border:1px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; margin-right:8px;">取消</button>
      <button id="cfgSave" style="padding:8px 16px; border:none; border-radius:8px; background:#4f46e5; color:#fff; cursor:pointer;">保存</button>
    </div>
    <div id="cfgMsg" style="margin-top:10px; font-size:13px; color:#dc2626;"></div>
  </div>
</div>

<script>
const input = document.getElementById('question');
const btn = document.getElementById('askBtn');
const answerEl = document.getElementById('answer');
const logEl = document.getElementById('log');
const modeBtns = document.querySelectorAll('.mode-btn[data-mode]');
const modeBtns = document.querySelectorAll('.mode-btn');
const modeStatus = document.getElementById('modeStatus');
let currentMode = 'deepseek';

// 加载当前模式 + 动态显示可用模式按钮
async function loadMode() {
  try {
    const resp = await fetch('/api/mode');
    const data = await resp.json();
    const avail = data.available_modes || ['deepseek', 'offline'];
    // 只显示可用的模式按钮（如 Ollama 未安装则不显示）
    modeBtns.forEach(b => {
      b.style.display = avail.includes(b.dataset.mode) ? '' : 'none';
    });
    setModeUI(data.mode);
  } catch (e) { /* 服务未就绪时保持默认 */ }
}

// 切换模式
async function switchMode(mode) {
  const resp = await fetch('/api/mode', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'mode=' + encodeURIComponent(mode)
  });
  const data = await resp.json();
  if (data.error) { alert('切换失败: ' + data.error); return; }
  setModeUI(data.mode);
  answerEl.className = 'loading';
  const tips = {
    'deepseek': 'DeepSeek（完整能力：天气/搜索/对话）',
    'openai': 'OpenAI',
    'qwen': '通义千问',
    'zhipu': '智谱 GLM',
    'moonshot': 'Kimi',
    'ollama': '本地模型（Ollama，免费离线对话）',
    'offline': '纯检索（免费，仅本地文档检索）'
  };
  answerEl.textContent = '已切换到 ' + (tips[data.mode] || data.mode) + '，可以提问了';
}

function setModeUI(mode) {
  currentMode = mode;
  modeBtns.forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  const status = {
    'deepseek': '当前：DeepSeek',
    'openai': '当前：OpenAI',
    'qwen': '当前：通义千问',
    'zhipu': '当前：智谱 GLM',
    'moonshot': '当前：Kimi',
    'ollama': '当前：本地模型（Ollama）',
    'offline': '当前：纯检索（免费）'
  };
  modeStatus.textContent = status[mode] || ('当前：' + mode);
}

// 绑定模式按钮
modeBtns.forEach(b => {
  b.addEventListener('click', () => switchMode(b.dataset.mode));
});

btn.addEventListener('click', ask);
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
loadMode();

// ===== 更换 API Key 弹窗逻辑 =====
const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const cfgProvider = document.getElementById('cfgProvider');
const cfgApiKey = document.getElementById('cfgApiKey');
const cfgBaseUrl = document.getElementById('cfgBaseUrl');
const cfgModel = document.getElementById('cfgModel');
const cfgMsg = document.getElementById('cfgMsg');

settingsBtn.addEventListener('click', () => {
  cfgMsg.textContent = '';
  cfgApiKey.value = '';
  settingsModal.style.display = 'flex';
});
document.getElementById('cfgCancel').addEventListener('click', () => {
  settingsModal.style.display = 'none';
});
settingsModal.addEventListener('click', e => {
  if (e.target === settingsModal) settingsModal.style.display = 'none';
});
document.getElementById('cfgSave').addEventListener('click', async () => {
  const provider = cfgProvider.value;
  const apiKey = cfgApiKey.value.trim();
  const baseUrl = cfgBaseUrl.value.trim();
  const model = cfgModel.value.trim();
  if (!apiKey) { cfgMsg.textContent = 'API Key 不能为空'; return; }
  try {
    const resp = await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'provider=' + encodeURIComponent(provider)
          + '&api_key=' + encodeURIComponent(apiKey)
          + '&base_url=' + encodeURIComponent(baseUrl)
          + '&model=' + encodeURIComponent(model)
    });
    const data = await resp.json();
    if (data.error) { cfgMsg.textContent = data.error; return; }
    cfgMsg.style.color = '#16a34a';
    cfgMsg.textContent = '✅ ' + data.message;
    setTimeout(() => { settingsModal.style.display = 'none'; }, 1200);
  } catch (err) {
    cfgMsg.textContent = '请求失败: ' + err.message;
  }
});
async function ask() {
  const question = input.value.trim();
  if (!question) return;
  btn.disabled = true;
  answerEl.className = 'loading';
  answerEl.textContent = 'Agent 正在思考…';
  logEl.innerHTML = '';
  refEl.textContent = '—';
  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'question=' + encodeURIComponent(question)
    });
    const data = await resp.json();
    if (data.error) { answerEl.className = 'error'; answerEl.textContent = data.error; return; }
    answerEl.className = '';
    answerEl.textContent = data.answer;
    (data.log || []).forEach(m => {
      const li = document.createElement('li');
      li.textContent = m;
      logEl.appendChild(li);
    });
    refEl.textContent = data.reflection || '—';
  } catch (err) {
    answerEl.className = 'error';
    answerEl.textContent = '请求失败: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
