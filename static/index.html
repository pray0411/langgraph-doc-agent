<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #ffffff; color: #1f2328; height: 100vh; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid #ececf1; background: #fff; }
  .logo { font-size: 17px; font-weight: 700; color: #1f2328; display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #10a37f, #19c37d); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  #modeSelect { padding: 6px 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; background: #fff; cursor: pointer; outline: none; color: #444; }
  .h-btn { padding: 6px 12px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; color: #555; font-size: 13px; cursor: pointer; transition: all .15s; }
  .h-btn:hover { border-color: #10a37f; color: #10a37f; }
  #chatArea { flex: 1; overflow-y: auto; }
  .chat-inner { max-width: 800px; margin: 0 auto; padding: 24px 24px 40px; display: flex; flex-direction: column; gap: 24px; }
  .welcome { text-align: center; padding: 60px 20px 20px; }
  .welcome-icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; background: linear-gradient(135deg, #10a37f, #19c37d); display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; box-shadow: 0 8px 24px rgba(16,163,127,.25); }
  .welcome h2 { font-size: 22px; color: #1f2328; margin-bottom: 10px; font-weight: 700; }
  .welcome p { color: #8e8ea0; font-size: 14px; line-height: 1.8; }
  .welcome-suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
  .suggestion { padding: 10px 18px; border: 1px solid #ececf1; border-radius: 12px; background: #fff; color: #444; font-size: 13px; cursor: pointer; transition: all .15s; }
  .suggestion:hover { border-color: #10a37f; color: #10a37f; background: #f9fdfb; }
  .msg { display: flex; gap: 14px; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .msg.assistant .avatar { background: linear-gradient(135deg, #10a37f, #19c37d); color: #fff; }
  .msg.user .avatar { background: #f0f0f4; color: #666; border: 1px solid #e4e4ea; }
  .msg-body { display: flex; flex-direction: column; gap: 4px; max-width: 82%; }
  .msg.user .msg-body { align-items: flex-end; }
  .msg-name { font-size: 12px; color: #9a9aa8; padding: 0 4px; }
  .bubble { padding: 12px 18px; border-radius: 16px; font-size: 14.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.assistant .bubble { background: #f7f7f9; color: #1f2328; border-top-left-radius: 4px; }
  .msg.user .bubble { background: #10a37f; color: #fff; border-top-right-radius: 4px; }
  .bubble.error { background: #fef2f2; color: #dc2626; }
  .typing-bubble { display: inline-flex; align-items: center; gap: 4px; padding: 14px 18px; background: #f7f7f9; border-radius: 16px; border-top-left-radius: 4px; }
  .typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: #b0b0bc; animation: bounce 1.2s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: .2s; }
  .typing-bubble span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
  .input-area { border-top: 1px solid #ececf1; padding: 12px 24px 16px; background: #fff; }
  .key-panel { max-width: 800px; margin: 0 auto 10px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fafafa; display: none; }
  .key-panel.open { display: block; animation: fadeIn .2s ease; }
  .key-panel-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #ececf1; font-size: 13px; font-weight: 600; color: #444; }
  .key-close { border: none; background: none; color: #999; cursor: pointer; font-size: 14px; padding: 4px; }
  .key-close:hover { color: #555; }
  .key-panel-body { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .key-row { display: flex; flex-direction: column; gap: 4px; }
  .key-row label { font-size: 12px; color: #888; }
  .key-row select, .key-row input { padding: 7px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; background: #fff; }
  .key-row select:focus, .key-row input:focus { border-color: #10a37f; }
  .key-actions { grid-column: 1 / -1; flex-direction: row; justify-content: flex-end; align-items: center; gap: 12px; }
  #cfgMsg { font-size: 12px; color: #dc2626; flex: 1; }
  .btn-save { padding: 8px 20px; border: none; border-radius: 8px; background: #10a37f; color: #fff; font-size: 13px; cursor: pointer; }
  .btn-save:hover { background: #0e8f70; }
  .input-box { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; border: 1px solid #e0e0e0; border-radius: 14px; padding: 8px 8px 8px 10px; background: #fff; transition: border-color .2s, box-shadow .2s; }
  .input-box:focus-within { border-color: #10a37f; box-shadow: 0 0 0 3px rgba(16,163,127,.12); }
  #keyToggle { width: 32px; height: 38px; border: none; background: none; color: #999; cursor: pointer; font-size: 16px; flex-shrink: 0; transition: color .15s; }
  #keyToggle:hover { color: #10a37f; }
  #question { flex: 1; border: none; outline: none; font-size: 14.5px; padding: 8px 0; resize: none; max-height: 140px; font-family: inherit; color: #1f2328; background: transparent; }
  #askBtn { width: 38px; height: 38px; border: none; border-radius: 10px; background: #10a37f; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  #askBtn:hover { background: #0e8f70; }
  #askBtn:disabled { background: #b9b9c4; cursor: not-allowed; }
  #keyToggle { width: 32px; height: 38px; border: none; background: none; color: #999; cursor: pointer; font-size: 16px; flex-shrink: 0; transition: color .15s; }
  #keyToggle:hover { color: #10a37f; }
  .current-model { font-size: 12px; color: #b0b0bc; padding: 0 6px 4px 0; flex-shrink: 0; white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="logo-icon">✦</div> AI Agent</div>
    <div class="header-right">
      <button class="h-btn" id="clearBtn">新对话</button>
    </div>
  </header>

  <div id="chatArea">

  <div id="chatArea">
    <div class="chat-inner" id="chatInner">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h2>我能帮你做什么？</h2>
        <p>文档问答 · 实时天气 · 联网搜索 · 普通对话</p>
        <div class="welcome-suggestions">
          <div class="suggestion" onclick="quickAsk('这个项目的核心架构是什么？')">项目架构</div>
          <div class="suggestion" onclick="quickAsk('今天北京的天气怎么样？')">查天气</div>
          <div class="suggestion" onclick="quickAsk('最近有什么AI新闻？')">AI 新闻</div>
          <div class="suggestion" onclick="quickAsk('1+1等于几？')">算数</div>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="key-panel" id="keyPanel">
      <div class="key-panel-header">
        <span>⚙ API Key 设置</span>
        <button class="key-close" id="keyPanelClose">✕</button>
      </div>
      <div class="key-panel-body">
        <div class="key-row">
          <label>服务商</label>
          <select id="cfgProvider">
            <option value="deepseek">DeepSeek（deepseek-chat）</option>
            <option value="openai">OpenAI（gpt-4o-mini）</option>
            <option value="qwen">通义千问（qwen-plus）</option>
            <option value="zhipu">智谱 GLM（glm-4-flash）</option>
            <option value="moonshot">Kimi（moonshot-v1-8k）</option>
          </select>
        </div>
        <div class="key-row">
          <label>API Key</label>
          <input id="cfgApiKey" type="password" placeholder="sk-...">
        </div>
        <div class="key-row">
          <label>Base URL（可选）</label>
          <input id="cfgBaseUrl" placeholder="默认官方地址">
        </div>
        <div class="key-row">
          <label>模型名（可选）</label>
          <input id="cfgModel" placeholder="默认模型">
        </div>
        <div class="key-row key-actions">
          <span id="cfgMsg"></span>
          <button class="btn-save" id="cfgSave">保存</button>
        </div>
      </div>
    </div>

    <div class="input-box">
      <button id="keyToggle" title="API Key 设置">⚙</button>
      <span class="current-model" id="currentModel"></span>
      <textarea id="question" rows="1" placeholder="发送消息…"></textarea>
      <button id="askBtn" title="发送">➤</button>
    </div>
    <div class="input-hint">Enter 发送 · Shift + Enter 换行</div>
  </div>
</div>

<script>
const input = document.getElementById('question');
const btn = document.getElementById('askBtn');
const chatInner = document.getElementById('chatInner');
const chatArea = document.getElementById('chatArea');
const keyPanel = document.getElementById('keyPanel');
const keyToggle = document.getElementById('keyToggle');
const keyPanelClose = document.getElementById('keyPanelClose');
const currentModel = document.getElementById('currentModel');
const cfgProvider = document.getElementById('cfgProvider');
const cfgApiKey = document.getElementById('cfgApiKey');
const cfgBaseUrl = document.getElementById('cfgBaseUrl');
const cfgModel = document.getElementById('cfgModel');
const cfgMsg = document.getElementById('cfgMsg');
let history = [];
let currentMode = 'deepseek';

// 当前模型显示映射
const MODEL_NAMES = {
  'deepseek': 'DeepSeek',
  'openai': 'OpenAI',
  'qwen': '通义千问',
  'zhipu': '智谱GLM',
  'moonshot': 'Kimi',
  'ollama': '本地 Ollama',
  'offline': '纯检索'
};

function updateModelDisplay(mode) {
  currentMode = mode;
  currentModel.textContent = MODEL_NAMES[mode] || mode;
}

async function loadMode() {
  try {
    const resp = await fetch('/api/mode');
    const data = await resp.json();
    updateModelDisplay(data.mode);
  } catch (e) {}
}
async function switchMode(mode) {
  const resp = await fetch('/api/mode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'mode=' + encodeURIComponent(mode)
  });
  const data = await resp.json();
  if (data.error) { alert('切换失败: ' + data.error); return; }
  updateModelDisplay(data.mode);
}

function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function addMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : '✦';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const name = document.createElement('div');
  name.className = 'msg-name';
  name.textContent = role === 'user' ? '你' : 'AI Agent';
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (content.startsWith('⚠') || content.startsWith('请求失败') ? ' error' : '');
  bubble.textContent = content;
  body.appendChild(name);
  body.appendChild(bubble);
  msg.appendChild(avatar);
  msg.appendChild(body);
  chatInner.appendChild(msg);
  scrollBottom();
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'typingMsg';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '✦';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const name = document.createElement('div');
  name.className = 'msg-name';
  name.textContent = 'AI Agent';
  const typing = document.createElement('div');
  typing.className = 'typing-bubble';
  typing.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(name);
  body.appendChild(typing);
  msg.appendChild(avatar);
  msg.appendChild(body);
  chatInner.appendChild(msg);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', question);
  addTyping();
  btn.disabled = true;
  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'question=' + encodeURIComponent(question) + '&history=' + encodeURIComponent(JSON.stringify(history))
    });
    const data = await resp.json();
    removeTyping();
    if (data.error) { addMessage('assistant', '⚠️ ' + data.error); return; }
    addMessage('assistant', data.answer);
    history.push({ role: 'user', content: question });
    history.push({ role: 'assistant', content: data.answer });
    if (history.length > 40) history = history.slice(-40);
  } catch (err) {
    removeTyping();
    addMessage('assistant', '⚠️ 请求失败: ' + err.message);
  } finally {
    btn.disabled = false;
  }
}

function quickAsk(q) { input.value = q; ask(); }

btn.addEventListener('click', ask);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  history = [];
  chatInner.innerHTML = '<div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h2>我能帮你做什么？</h2><p>文档问答 · 实时天气 · 联网搜索 · 普通对话</p><div class="welcome-suggestions"><div class="suggestion" onclick="quickAsk(\'这个项目的核心架构是什么？\')">项目架构</div><div class="suggestion" onclick="quickAsk(\'今天北京的天气怎么样？\')">查天气</div><div class="suggestion" onclick="quickAsk(\'最近有什么AI新闻？\')">AI 新闻</div><div class="suggestion" onclick="quickAsk(\'1+1等于几？\')">算数</div></div></div>';
});

keyToggle.addEventListener('click', () => {
  keyPanel.classList.toggle('open');
  if (keyPanel.classList.contains('open')) cfgMsg.textContent = '';
});
keyPanelClose.addEventListener('click', () => keyPanel.classList.remove('open'));

document.getElementById('cfgSave').addEventListener('click', async () => {
  const provider = cfgProvider.value;
  const apiKey = cfgApiKey.value.trim();
  const baseUrl = cfgBaseUrl.value.trim();
  const model = cfgModel.value.trim();
  if (!apiKey) { cfgMsg.textContent = 'API Key 不能为空'; return; }
  try {
    const resp = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'provider=' + encodeURIComponent(provider)
          + '&api_key=' + encodeURIComponent(apiKey)
          + '&base_url=' + encodeURIComponent(baseUrl)
          + '&model=' + encodeURIComponent(model)
    });
    const data = await resp.json();
    if (data.error) { cfgMsg.textContent = data.error; return; }
    cfgMsg.style.color = '#16a34a';
    cfgMsg.textContent = '✅ ' + data.message;
    switchMode(provider);
    setTimeout(() => {
      keyPanel.classList.remove('open');
      cfgMsg.style.color = '#dc2626';
      cfgMsg.textContent = '';
    }, 1200);
  } catch (err) {
    cfgMsg.textContent = '请求失败: ' + err.message;
  }
});

loadMode();
</script>
</body>
</html>
