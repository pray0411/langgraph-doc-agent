<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; color: #1f2328; height: 100vh; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #e8e8e8; background: #fff; }
  .logo { font-size: 16px; font-weight: 700; color: #1f2328; display: flex; align-items: center; gap: 8px; }
  .logo span { color: #4f46e5; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  #modeSelect { padding: 6px 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; background: #fff; cursor: pointer; outline: none; }
  .header-btn { padding: 6px 12px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; color: #57606a; font-size: 13px; cursor: pointer; }
  .header-btn:hover { border-color: #4f46e5; color: #4f46e5; }
  #chatArea { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 12px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .msg.user .avatar { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
  .msg.assistant .avatar { background: #f0f0f0; color: #57606a; }
  .bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.7; max-width: 78%; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #4f46e5; color: #fff; border-top-right-radius: 4px; }
  .msg.assistant .bubble { background: #f6f8fa; color: #1f2328; border-top-left-radius: 4px; }
  .bubble.error { background: #fef2f2; color: #dc2626; }
  .typing { color: #999; font-size: 13px; }
  .typing::after { content: '…'; animation: dots 1.2s infinite; }
  @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
  .input-area { border-top: 1px solid #e8e8e8; padding: 12px 20px 16px; display: flex; gap: 10px; background: #fff; }
  #question { flex: 1; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; resize: none; }
  #question:focus { border-color: #4f46e5; }
  #askBtn { padding: 12px 24px; background: #4f46e5; color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
  #askBtn:hover { background: #4338ca; }
  #askBtn:disabled { opacity: .5; cursor: not-allowed; }
  .empty-hint { text-align: center; color: #b0b7c6; margin-top: 60px; font-size: 14px; }
  .empty-hint .big { font-size: 40px; margin-bottom: 12px; }

  /* 换 Key 弹窗 */
  #settingsModal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; }
  .modal-card { background:#fff; border-radius:12px; padding:24px; width:420px; max-width:90%; box-shadow:0 4px 20px rgba(0,0,0,.2); }
  .modal-card h3 { margin-bottom:16px; color:#1a1a2e; font-size:16px; }
  .modal-card label { font-size:13px; color:#666; display:block; margin-bottom:4px; }
  .modal-card select, .modal-card input { width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; margin-bottom:12px; font-size:13px; }
  .modal-card .row { text-align:right; }
  .modal-card button { padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; }
  .btn-cancel { border:1px solid #ddd; background:#fff; margin-right:8px; }
  .btn-save { border:none; background:#4f46e5; color:#fff; }
  #cfgMsg { margin-top:10px; font-size:13px; color:#dc2626; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span>✦</span> AI Agent</div>
    <div class="header-actions">
      <select id="modeSelect">
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
        <option value="qwen">通义千问</option>
        <option value="zhipu">智谱GLM</option>
        <option value="moonshot">Kimi</option>
        <option value="ollama">本地 · Ollama</option>
        <option value="offline">纯检索 · 免费</option>
      </select>
      <button class="header-btn" id="clearBtn">清空</button>
      <button class="header-btn" id="settingsBtn">⚙ Key</button>
    </div>
  </header>

  <div id="chatArea">
    <div class="empty-hint">
      <div class="big">✦</div>
      <div>我是 AI Agent，可以对话、查天气、搜新闻、读文档</div>
      <div style="margin-top:6px; font-size:12px;">试试问我：今天北京天气 / 最近有什么AI新闻 / 这个项目的架构</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="question" rows="1" placeholder="输入消息… (Enter 发送)" style="max-height:120px;"></textarea>
    <button id="askBtn">发送</button>
  </div>
</div>

<!-- 更换 API Key 弹窗 -->
<div id="settingsModal">
  <div class="modal-card">
    <h3>更换 API Key</h3>
    <label>服务商</label>
    <select id="cfgProvider">
      <option value="deepseek">DeepSeek（deepseek-chat）</option>
      <option value="openai">OpenAI（gpt-4o-mini）</option>
      <option value="qwen">通义千问（qwen-plus）</option>
      <option value="zhipu">智谱 GLM（glm-4-flash）</option>
      <option value="moonshot">Kimi（moonshot-v1-8k）</option>
    </select>
    <label>API Key</label>
    <input id="cfgApiKey" type="password" placeholder="sk-...">
    <label>Base URL（可选）</label>
    <input id="cfgBaseUrl" placeholder="默认官方地址">
    <label>模型名（可选）</label>
    <input id="cfgModel" placeholder="默认模型">
    <div class="row">
      <button class="btn-cancel" id="cfgCancel">取消</button>
      <button class="btn-save" id="cfgSave">保存</button>
    </div>
    <div id="cfgMsg"></div>
  </div>
</div>

<script>
const input = document.getElementById('question');
const btn = document.getElementById('askBtn');
const chatArea = document.getElementById('chatArea');
const modeSelect = document.getElementById('modeSelect');
const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const cfgProvider = document.getElementById('cfgProvider');
const cfgApiKey = document.getElementById('cfgApiKey');
const cfgBaseUrl = document.getElementById('cfgBaseUrl');
const cfgModel = document.getElementById('cfgModel');
const cfgMsg = document.getElementById('cfgMsg');
let currentMode = 'deepseek';
let history = [];  // 多轮对话历史

// ---------- 消息渲染 ----------
function addMessage(role, content) {
  // 移除空状态提示
  const empty = chatArea.querySelector('.empty-hint');
  if (empty) empty.remove();

  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'typingMsg';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.textContent = '思考中';
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

// ---------- 提问 ----------
async function ask() {
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', question);
  addTyping();
  btn.disabled = true;

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'question=' + encodeURIComponent(question)
          + '&history=' + encodeURIComponent(JSON.stringify(history))
    });
    const data = await resp.json();
    removeTyping();
    if (data.error) {
      addMessage('assistant', '⚠️ ' + data.error);
      return;
    }
    addMessage('assistant', data.answer);
    // 更新历史
    history.push({role: 'user', content: question});
    history.push({role: 'assistant', content: data.answer});
    if (history.length > 40) history = history.slice(-40);
  } catch (err) {
    removeTyping();
    addMessage('assistant', '⚠️ 请求失败: ' + err.message);
  } finally {
    btn.disabled = false;
  }
}

// ---------- 输入框 ----------
btn.addEventListener('click', ask);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    ask();
  }
});
// 自动增高
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ---------- 清空对话 ----------
document.getElementById('clearBtn').addEventListener('click', () => {
  history = [];
  chatArea.innerHTML = '<div class="empty-hint"><div class="big">✦</div><div>新对话已开始</div></div>';
});

// ---------- 模式 ----------
async function loadMode() {
  try {
    const resp = await fetch('/api/mode');
    const data = await resp.json();
    const avail = data.available_modes || ['deepseek', 'offline'];
    Array.from(modeSelect.options).forEach(opt => {
      opt.style.display = avail.includes(opt.value) ? '' : 'none';
    });
    modeSelect.value = data.mode;
  } catch (e) {}
}
async function switchMode(mode) {
  const resp = await fetch('/api/mode', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'mode=' + encodeURIComponent(mode)
  });
  const data = await resp.json();
  if (data.error) { alert('切换失败: ' + data.error); return; }
  modeSelect.value = data.mode;
}
modeSelect.addEventListener('change', () => switchMode(modeSelect.value));

// ---------- 换 Key ----------
settingsBtn.addEventListener('click', () => {
  cfgMsg.textContent = '';
  cfgApiKey.value = '';
  settingsModal.style.display = 'flex';
});
document.getElementById('cfgCancel').addEventListener('click', () => {
  settingsModal.style.display = 'none';
});
settingsModal.addEventListener('click', e => {
  if (e.target === settingsModal) settingsModal.style.display = 'none';
});
document.getElementById('cfgSave').addEventListener('click', async () => {
  const provider = cfgProvider.value;
  const apiKey = cfgApiKey.value.trim();
  const baseUrl = cfgBaseUrl.value.trim();
  const model = cfgModel.value.trim();
  if (!apiKey) { cfgMsg.textContent = 'API Key 不能为空'; return; }
  try {
    const resp = await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'provider=' + encodeURIComponent(provider)
          + '&api_key=' + encodeURIComponent(apiKey)
          + '&base_url=' + encodeURIComponent(baseUrl)
          + '&model=' + encodeURIComponent(model)
    });
    const data = await resp.json();
    if (data.error) { cfgMsg.textContent = data.error; return; }
    cfgMsg.style.color = '#16a34a';
    cfgMsg.textContent = '✅ ' + data.message;
    modeSelect.value = provider;
    switchMode(provider);
    setTimeout(() => { settingsModal.style.display = 'none'; }, 1200);
  } catch (err) {
    cfgMsg.textContent = '请求失败: ' + err.message;
  }
});

loadMode();
</script>
</body>
</html>
