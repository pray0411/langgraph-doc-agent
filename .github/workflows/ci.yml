name: CI

# 为什么要有这个文件：README 此前写着"测试不依赖真实网络"，但那只是**文档承诺**。
# 有 CI 之后，"测试是不是真的干净"变成任何人点开 Action 页就能看到的**可验证事实**。
#
# 注意顺序：CI 必须在"测试套件密封性修复"之后启用。反了的话第一次 push 就红 ——
# 那会很尴尬。这里先上，说明密封性已经修完。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 主测试：跨平台 × 跨 Python 版本 ----------
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 项目 Windows 优先（README 里的运行示例都是 Windows 风格），
        # 但 Linux 也要跑 —— 只在自己机器上绿的测试套件没有说服力。
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行测试（含覆盖率门禁）
        # 关键：这里**不提供任何 API Key、不提供 .env**。
        # 如果测试套件还残留"靠本机 .env 里的真实 Key 才能过"的用例，这一步必然失败 ——
        # 这正是我们要在 CI 上暴露的东西。
        env:
          PYTHONUTF8: "1"
        run: >
          python -X utf8 -m pytest tests/
          --cov=. --cov-report=term-missing --cov-report=xml
          --html=report/report.html --self-contained-html
          --junitxml=junit/test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
          -p no:randomly

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            junit/*.xml
            coverage.xml
            report/report.html
          if-no-files-found: ignore
          retention-days: 14

  # ---------- 前端 E2E（Playwright，单独阶段） ----------
  # 为什么单独一个 job：需要下载 ~120MB 的 Chromium，且比单元测试慢一个量级。
  # 放在同一个 job 里会让"大多数时候都很快的反馈"被拖慢。
  e2e:
    name: e2e (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install playwright==1.56.0
      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium
      - name: 跑前端金路径 + XSS 注入用例
        env:
          PYTHONUTF8: "1"
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -X utf8 -m pytest tests/e2e -m e2e -q
      - name: 上传失败时的截图/追踪
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/**/*.png
            tests/e2e/**/*.zip
          if-no-files-found: ignore

  # ---------- 变异测试（回应"覆盖率虚高"，非阻断） ----------
  # 为什么非阻断：变异测试天生慢（每个变异体要重跑一遍相关用例），
  # 且低分不代表有 bug、只代表"测试可能抓不住"。它提供的是**信号**而不是门禁。
  mutation:
    name: mutmut (signal)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install mutmut==3.3.0
      - name: 对核心模块做变异测试
        env:
          PYTHONUTF8: "1"
        run: |
          python -m mutmut run --paths-to-mutate approvals.py,retriever.py || true
          python -m mutmut results || true

  # ---------- lint ----------
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.14.2
      - name: ruff check
        run: ruff check . --output-format=github

  # ---------- 依赖漏洞扫描 ----------
  security:
    name: pip-audit
    runs-on: ubuntu-latest
    # 已知漏洞的修复往往不由本项目控制（要等上游发版），因此不阻断主流程，
    # 但必须留下可见记录 —— 静默通过的扫描等于没扫。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit==2.9.0
      - name: 扫描 requirements.txt
        run: pip-audit -r requirements.txt --desc

  # ---------- 依赖可安装性 ----------
  #
  # 为什么要单独一个 job（外部评审第 4 条）：项目曾经在 README 里教人
  # `pip install -r requirements-mcp.txt`，而该文件因版本冲突**根本装不上**
  # （mcp==1.22.0 与 fastmcp==4.0.3 的依赖链互斥，pip 直接 ResolutionImpossible）。
  # 本机因为早已装好相关包，`import` 一切正常，这个事实被掩盖了很久。
  # 「照文档装依赖」必须是一条被 CI 守着的不变量，而不是靠运气。
  #
  # 实现放在 scripts/check_deps.py，与本地手动校验共用同一份逻辑 ——
  # 两处各写一遍是漂移的开始。
  deps-installable:
    name: 依赖可安装性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 升级 pip
        run: python -m pip install --upgrade pip
      - name: 四个 requirements 文件都必须能被解析
        run: python -X utf8 scripts/check_deps.py
