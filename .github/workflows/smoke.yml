name: 真模型冒烟

# 为什么单独一个 workflow（外部评审第 5 条）：
# 主 CI 的全部用例都跑在**本地假 OpenAI 兼容服务**上 —— 这是对的（确定性、
# 零成本），但它证明不了"真实模型能按预期使用这些工具"。真实服务商的
# 行为差异（工具 schema 校验、流式分片、限流、超时）只有真调用才暴露。
# 因此这里用定时 + 手动触发，且**不阻断主流程**：它失败说明需要人看一眼，
# 而不是拦住合入。
on:
  schedule:
    # 每天 UTC 18:00（北京时间 02:00）跑一次
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      question:
        description: "自定义冒烟问题（留空则跑标准三条链路）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    name: 真模型主链路冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 检查是否配置了模型密钥
        id: key
        # 未配置 secret 时跳过后续步骤：让 fork / 未配置的环境保持绿色，
        # 而不是持续红灯（红灯必须意味着"有东西需要看"）。
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DEEPSEEK_API_KEY secret，跳过真模型冒烟"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 跑三条主链路（纯问答 / 工具调用 / 检索）
        if: steps.key.outputs.configured == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: deepseek
          PRAY_SMOKE: "1"   # 显式开关：没有它，用例会主动跳过（防意外外呼）
        run: python -X utf8 -m pytest tests/smoke -m smoke -q -s

      - name: 上传日志（失败时便于定位）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: logs/
          if-no-files-found: ignore
